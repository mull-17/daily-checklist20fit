<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buat Password Baru — 20FIT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <div class="logo">
        <img src="assets/img/20fit-logo.png" alt="20FIT">
      </div>

      <h1 class="title">Buat password baru</h1>
      <p class="subtitle">Password baru minimal 8 karakter dan harus cocok dengan konfirmasinya.</p>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">Password baru</label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" placeholder="Masukkan password baru" required>
            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Tampilkan password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="strength-bars" id="strengthBars">
            <div></div><div></div><div></div><div></div>
          </div>
          <div class="error-msg" id="newPassword-err">Minimal 8 karakter</div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Ulangi password baru" required>
            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Tampilkan password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="error-msg" id="confirmPassword-err">Password tidak cocok</div>
        </div>

        <button type="submit" class="btn">Simpan password baru</button>
      </form>
      <p id="message"></p>
    </div>
  </main>
  <script type="module" src="./js/reset-password.js"></script>
</body>
</html>
