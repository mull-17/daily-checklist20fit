<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Checking</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="dashboard-container">
    <div class="dashboard-card home-card">
      <h1>Daily Checking</h1>
      <p id="welcomeText">
        Selamat datang 👋
      </p>
      <!-- OPENING -->
      <a href="opening.html" class="menu-card">
        <div class="menu-icon"><span>
          <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
  <path fill-rule="evenodd" d="M13 3a1 1 0 1 0-2 0v2a1 1 0 1 0 2 0V3ZM6.343 4.929A1 1 0 0 0 4.93 6.343l1.414 1.414a1 1 0 0 0 1.414-1.414L6.343 4.929Zm12.728 1.414a1 1 0 0 0-1.414-1.414l-1.414 1.414a1 1 0 0 0 1.414 1.414l1.414-1.414ZM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm-9 4a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2H3Zm16 0a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2h-2ZM7.757 17.657a1 1 0 1 0-1.414-1.414l-1.414 1.414a1 1 0 1 0 1.414 1.414l1.414-1.414Zm9.9-1.414a1 1 0 0 0-1.414 1.414l1.414 1.414a1 1 0 0 0 1.414-1.414l-1.414-1.414ZM13 19a1 1 0 1 0-2 0v2a1 1 0 1 0 2 0v-2Z" clip-rule="evenodd"/>
</svg>

        </span></div>
        <h2>Opening Checklist</h2>
        <p>
          Checklist kebersihan 
        </p>
        <span class="menu-button">
          Mulai Checklist →
        </span>
      </a>
      <!-- CLOSING -->
      <a href="closing.html" class="menu-card">
        <div class="menu-icon"><span>
          <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
  <path fill-rule="evenodd" d="M11.675 2.015a.998.998 0 0 0-.403.011C6.09 2.4 2 6.722 2 12c0 5.523 4.477 10 10 10 4.356 0 8.058-2.784 9.43-6.667a1 1 0 0 0-1.02-1.33c-.08.006-.105.005-.127.005h-.001l-.028-.002A5.227 5.227 0 0 0 20 14a8 8 0 0 1-8-8c0-.952.121-1.752.404-2.558a.996.996 0 0 0 .096-.428V3a1 1 0 0 0-.825-.985Z" clip-rule="evenodd"/>
</svg>

        </span></div>
        <h2>Closing Checklist</h2>
        <p>
          Checklist kebersihan
        </p>
        <span class="menu-button">
          Mulai Checklist →
        </span>
      </a>
      <!-- ISSUE -->
      <a href="issue.html" class="menu-card">
        <div class="menu-icon"><span>
          <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
  <path d="M8.4 6.763c-.251.1-.383.196-.422.235L6.564 5.584l2.737-2.737c1.113-1.113 3.053-1.097 4.337.187l1.159 1.159a1 1 0 0 1 1.39.022l4.105 4.105a1 1 0 0 1 .023 1.39l1.345 1.346a1 1 0 0 1 0 1.415l-2.052 2.052a1 1 0 0 1-1.414 0l-1.346-1.346a1 1 0 0 1-1.323.039L11.29 8.983a1 1 0 0 1 .04-1.324l-.849-.848c-.18-.18-.606-.322-1.258-.25a3.271 3.271 0 0 0-.824.202Zm1.519 3.675L3.828 16.53a1 1 0 0 0 0 1.414l2.736 2.737a1 1 0 0 0 1.414 0l6.091-6.091-4.15-4.15Z"/>
</svg>

        </span></div>
        <h2>Fasilitas / Kerusakan</h2>
        <p>
          Laporkan fasilitas atau barang yang mengalami kerusakan
        </p>
        <span class="menu-button">
          Buat Laporan →
        </span>
      </a>
      <button id="logoutBtn" class="btn">
        Logout
      </button>
    </div>
  </main>
  <script type="module">
    import { supabase } from "./js/supabase.js";
    const welcomeText =
      document.getElementById("welcomeText");
    const logoutBtn =
      document.getElementById("logoutBtn");
    // ========================================
    // CEK SESSION
    // ========================================
    const {
      data: { session }
    } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "index.html";
    }
    // ========================================
    // AMBIL PROFILE
    // ========================================
    if (session) {
      const {
        data: profile,
        error
      } = await supabase
        .from("profiles")
        .select("full_name, role")
        .eq("id", session.user.id)
        .single();
      if (!error && profile) {
        welcomeText.textContent =
          `Halo, ${profile.full_name} 👋`;
      }
    }
// LOGOUT
    logoutBtn.addEventListener(
      "click",
      async () => {
        await supabase.auth.signOut();
        window.location.href = "index.html";
      }
    );
  </script>
</body>
</html>
