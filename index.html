<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Daily Cleaning</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <div class="logo">
       <img src="assets/img/20fit-logo.png" alt="20FIT">
      </div>
      </p>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">
            Email
          </label>
          <input type="email" id="email" placeholder="Masukkan email" required>
        </div>
        <div class="form-group">
          <label for="password">
            Password
          </label>
          <div class="password-wrapper">
          <input type="password" id="password" placeholder="Masukkan password" required>
            <button type="button" id="togglePassword" class="password-toggle"
            aria-label="Tampilkan password">
            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none">
      <path
        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle
        cx="12"
        cy="12"
        r="3"
        stroke="currentColor"
        stroke-width="2"
      />
    </svg>
    <!-- Mata dicoret -->
    <svg id="eyeClosed" viewBox="0 0 24 24" fill="none">
      <path
        d="M3 3l18 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
      <path
        d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.7 18.7 0 0 1-3.2 3.8"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
      <path
        d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
            </button>
            </div>
        </div>
        <div class="remember-me">
            <label>
                <input type="checkbox" id="rememberMe">
                <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="forgot-link">Lupa password?</a>
        </div>
        <button type="submit" class="btn">
          Login
        </button>
      </form>
      <p id="message"></p>
    </div>
  </main>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
