<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa Password — 20FIT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-container">
  <div class="login-card">
    <div class="logo">
      <img src="assets/img/20fit-logo.png" alt="20FIT">
    </div>
    <h1 class="title">Lupa password</h1>
    <p class="subtitle">Masukkan email akun kamu. Kami akan mengirimkan kode verifikasi 6 digit untuk reset password.</p>
    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Masukkan email" required>
        <div class="error-msg" id="email-err">Masukkan email yang valid</div>
      </div>
      <button type="submit" class="btn">Kirim kode reset</button>
    </form>
    <a href="index.html" class="back-link back-link-center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Kembali ke login
    </a>
    <p id="message"></p>
  </div>
</main>
<script type="module" src="./js/forgot-password.js"></script>
</body>
</html>
